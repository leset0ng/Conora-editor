[package]
name = "corona-cli"
version = "0.2.2"
edition = "2024"
rust-version = "1.88"
description = "Build icon themes for multiple watch firmwares as CRPack resource packs"
license = "MIT"
repository = "https://github.com/leset0ng/Conora-editor"
readme = "README.md"

[[bin]]
name = "corona"
path = "src/main.rs"

[dependencies]
corona-core = { path = "../corona-core", version = "0.2.2" }
clap = { version = "4.5", features = ["derive"] }
serde_json = "1"
tempfile = "3"
image = { version = "0.25.10", default-features = false, features = ["png"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
