[package]
name = "conora-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Build icon themes for multiple watch firmwares as CRPack resource packs"
license = "MIT"
repository = "https://github.com/leset0ng/Conora-editor"
readme = "README.md"

[[bin]]
name = "conora"
path = "src/main.rs"

[dependencies]
conora-core = { path = "../conora-core", version = "0.1.0" }
clap = { version = "4.5", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
