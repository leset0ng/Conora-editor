[package]
name = "corona-crpack-builder"
version = "0.1.1"
edition = "2024"
publish = false

[workspace]
members = ["crates/corona-core", "crates/corona-cli"]
default-members = ["crates/corona-core", "crates/corona-cli"]
resolver = "3"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
astrobox-ng-wit = "0.4"
corona-core = { path = "crates/corona-core", version = "0.2.4" }
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = "0.3"
serde_json = "1.0"
