[package]
name = "conora-crpack-builder"
version = "0.1.1"
edition = "2024"
publish = false

[workspace]
members = ["crates/conora-core", "crates/conora-cli"]
default-members = ["crates/conora-core", "crates/conora-cli"]
resolver = "3"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
astrobox-ng-wit = "0.4"
conora-core = { path = "crates/conora-core", version = "0.2.1" }
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = "0.3"
serde_json = "1.0"
