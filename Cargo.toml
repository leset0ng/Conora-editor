[package]
name = "conora-crpack-builder"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
astrobox-ng-wit = "0.4"
image = { version = "0.25.10", default-features = false, features = ["png"] }
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = "0.3"
serde_json = "1.0"
